<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skip Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap">
<style>
:root{--bg:#f4f5fb;--pn:#fff;--tx:#1b1f3b;--mu:#5d6285;--ln:#dfe2f2;--ac:#3b47c4;--on:#fff;--rs:#d6456b;--rt:#fbe3ea}
@media (prefers-color-scheme:dark){:root{--bg:#12142a;--pn:#1c1f3d;--tx:#eceefb;--mu:#a3a8d0;--ln:#2e3263;--ac:#8f99ff;--on:#12142a;--rs:#ff7f9f;--rt:#3a2038;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 "Readex Pro",system-ui,Tahoma,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo svg{width:34px;height:34px}
.pills,.seg{display:inline-flex;gap:4px;border-radius:99px;padding:3px}
.pills{background:var(--pn);border:1px solid var(--ln)}
.seg{background:var(--bg);margin-bottom:12px}
.pills button,.seg button{border:0;background:none;color:var(--mu);padding:5px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.pills button.on,.seg button.on{background:var(--ac);color:var(--on)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.2;letter-spacing:-.02em;font-weight:700;margin:40px 0 12px;max-width:15em}
.sub{color:var(--mu);max-width:36em;margin:0 0 28px}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-top:16px}
.in{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:12px 22px;border-radius:99px;border:0;background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:none;color:var(--tx);border:1px solid var(--ln);font-weight:400}
.btn.on{background:var(--rs);color:#fff}
#fname{color:var(--mu);align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.err{color:var(--rs);margin:8px 0 0;min-height:1.4em;font-size:14px}
.tl{position:relative;height:26px;border-radius:13px;background:var(--ac);overflow:hidden;cursor:pointer;direction:ltr}
.tl.demo{height:34px;cursor:default;margin:8px 0 28px}
.cut{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--rs) 0 3px,var(--rt) 3px 7px)}
.pend{position:absolute;top:0;bottom:0;width:3px;background:var(--rs)}
#ph{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px var(--tx);left:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.steps li{display:flex;gap:12px;align-items:center}
.steps b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pn);border:1px solid var(--ln);display:grid;place-items:center}
#pl,#lv{width:100%;aspect-ratio:16/9;border:0;border-radius:20px;background:#000;display:block}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px;color:var(--mu);font-size:14px}
.lg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline:10px 4px}
.lg i:first-child{margin-inline-start:0}
.k{background:var(--ac)}.s{background:repeating-linear-gradient(45deg,var(--rs) 0 3px,var(--rt) 3px 7px)}
h2{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row input{text-align:center}
.row.bad input{border-color:var(--rs)}
.x{border:0;background:none;color:var(--mu);font-size:22px;cursor:pointer;padding:0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.muted{color:var(--mu);font-size:14px}
textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:14px;background:var(--bg);color:var(--tx);font:13px/1.5 ui-monospace,Consolas,monospace;direction:ltr}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.li:first-child{border-top:0}.li div{flex:1;min-width:0}.li strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.li .btn{padding:8px 18px}
.big{width:100%;padding:16px;font-size:18px}.prog{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:12px}.prog i{display:block;height:100%;width:0;background:var(--ac)}a.btn{display:inline-block;text-decoration:none;margin-top:12px}summary{cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
 <div class="logo"><svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="var(--ac)"/><rect x="5" y="15" width="10" height="4" rx="2" fill="var(--on)"/><rect x="19" y="15" width="10" height="4" rx="2" fill="var(--on)"/></svg><span>Skip Player</span></div>
 <div class="pills"><button data-l="ar">العربية</button><button data-l="fr">Français</button><button data-l="en">English</button></div>
</header>

<h1 data-t="h1"></h1>
<p class="sub" data-t="sub"></p>

<section class="panel">
 <div class="seg"><button id="mYt" data-t="tYt"></button><button id="mLoc" data-t="tLoc"></button></div>
 <div class="in" id="ytIn"><input type="text" id="url" dir="ltr" data-p="ph" autocomplete="off"><button class="btn" id="go" data-t="play"></button></div>
 <div class="in" id="locIn" hidden><label class="btn alt" for="file" data-t="pick"></label><input type="file" id="file" accept="video/*" hidden><span id="fname"></span></div>
 <div class="err" id="err" role="alert"></div>
</section>

<section class="panel" id="lib" hidden><h2 data-t="lib"></h2><div id="libList"></div></section>

<section id="hero">
 <div class="tl demo" aria-hidden="true"><i class="cut" style="left:20%;width:11%"></i><i class="cut" style="left:58%;width:7%"></i></div>
 <ol class="steps"><li><b>1</b><span data-t="s1"></span></li><li><b>2</b><span data-t="s2"></span></li><li><b>3</b><span data-t="s3"></span></li></ol>
</section>

<section id="stage" hidden>
 <div class="panel" style="padding:0;border:0;background:none;margin-top:20px">
  <div id="pl"></div><video id="lv" controls playsinline hidden></video>
  <div class="tl" id="tl" style="margin-top:14px"><span id="cuts"></span><i id="ph"></i></div>
  <div class="meta"><span class="lg"><i class="k"></i><span data-t="lk"></span><i class="s"></i><span data-t="ls"></span></span><span id="tt" dir="ltr"></span></div>
  <div class="acts"><button class="btn big" id="mark"></button></div>
  <p class="muted" data-t="tip"></p>
 </div>
 <div class="panel">
  <h2 data-t="rT"></h2>
  <p class="muted" id="rEmpty" data-t="rE"></p>
  <div id="rows"></div>
  <p class="err" id="rerr" hidden data-t="badT"></p>
  <div class="acts"><button class="btn alt" id="add" data-t="add"></button></div>
 </div>
 <div class="panel" id="ffbox" hidden>
  <h2 data-t="svT"></h2>
  <p class="muted" data-t="svN"></p>
  <div class="acts"><button class="btn" id="rec" data-t="svB"></button><button class="btn alt" id="cancel" hidden data-t="cancel"></button></div>
  <div class="prog" id="prog" hidden><i id="pbar"></i></div>
  <p class="muted" id="rst"></p>
  <a class="btn" id="dl" hidden></a>
  <details style="margin-top:14px"><summary class="muted" data-t="adv"></summary>
   <p class="muted" data-t="ffN"></p>
   <textarea id="cmd" readonly rows="5"></textarea>
   <div class="acts"><button class="btn alt" id="cp"></button></div>
  </details>
 </div>
</section>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
var TX={
en:{h1:"Watch it without the parts you don’t want",sub:"Paste a YouTube link or pick a video from your device, mark what to skip, and press play. Nothing is downloaded or changed.",tYt:"YouTube",tLoc:"My device",ph:"Paste a YouTube link",play:"Play",pick:"Choose a video",s1:"Add a video",s2:"Mark the parts to skip",s3:"Watch without them",lk:"Plays",ls:"Skipped",rT:"Parts that will be skipped",rE:"Nothing skipped yet. Press “Skip from now” while the video plays, or type the times yourself.",from:"From",to:"To",add:"Add by hand",skip:"Skip from now",end:"End skip here",ffT:"Save a cut copy",ffN:"For your own files only. Install ffmpeg, then paste this command in a terminal opened in the video’s folder.",copy:"Copy",copied:"Copied",bad:"That doesn’t look like a YouTube link.",api:"YouTube couldn’t load. Check your connection and reload.",badT:"Use times like 2:30, with “from” before “to”."},
fr:{h1:"Regardez sans les passages que vous ne voulez pas",sub:"Collez un lien YouTube ou choisissez une vidéo sur votre appareil, marquez ce qu’il faut ignorer, puis lancez la lecture. Rien n’est téléchargé ni modifié.",tYt:"YouTube",tLoc:"Mon appareil",ph:"Collez un lien YouTube",play:"Lire",pick:"Choisir une vidéo",s1:"Ajoutez une vidéo",s2:"Marquez les passages à ignorer",s3:"Regardez sans eux",lk:"Lu",ls:"Ignoré",rT:"Passages ignorés",rE:"Rien d’ignoré pour l’instant. Appuyez sur « Ignorer à partir de maintenant » pendant la lecture, ou saisissez les temps.",from:"De",to:"À",add:"Ajouter à la main",skip:"Ignorer à partir de maintenant",end:"Fin du passage ici",ffT:"Enregistrer une copie coupée",ffN:"Pour vos propres fichiers uniquement. Installez ffmpeg, puis collez cette commande dans un terminal ouvert dans le dossier de la vidéo.",copy:"Copier",copied:"Copié",bad:"Ce n’est pas un lien YouTube.",api:"YouTube n’a pas pu se charger. Vérifiez la connexion et rechargez.",badT:"Utilisez des temps comme 2:30, avec « de » avant « à »."},
ar:{h1:"شاهد بدون المقاطع التي لا تريدها",sub:"الصق رابط يوتيوب أو اختر فيديو من جهازك، حدّد ما تريد تخطّيه ثم اضغط تشغيل. لا يتم تحميل شيء ولا تعديل الفيديو.",tYt:"يوتيوب",tLoc:"جهازي",ph:"الصق رابط يوتيوب",play:"تشغيل",pick:"اختر فيديو",s1:"أضف فيديو",s2:"حدّد المقاطع المراد تخطّيها",s3:"شاهد بدونها",lk:"يُعرض",ls:"يُتخطّى",rT:"المقاطع التي سيتم تخطّيها",rE:"لا يوجد شيء بعد. اضغط «تخطَّ من الآن» أثناء التشغيل، أو اكتب الأوقات بنفسك.",from:"من",to:"إلى",add:"إضافة يدويًا",skip:"تخطَّ من الآن",end:"انتهى التخطّي هنا",ffT:"احفظ نسخة مقطوعة",ffN:"لملفاتك الخاصة فقط. ثبّت ffmpeg ثم الصق هذا الأمر في الطرفية داخل مجلد الفيديو.",copy:"نسخ",copied:"تم النسخ",bad:"هذا لا يبدو رابط يوتيوب.",api:"تعذّر تحميل يوتيوب. تحقق من الاتصال وأعد التحميل.",badT:"استعمل أوقاتًا مثل 2:30 على أن تكون «من» قبل «إلى»."}
};
var lang="en";try{var nl=(navigator.language||"en").slice(0,2);if(TX[nl])lang=nl}catch(e){}
var $=function(i){return document.getElementById(i)};
var mode="yt",player=null,ready=false,lf=null,curId=null,lv=$("lv"),skips=[],pend=null,lastSeek=0,lastDur=0,active=false;
window.onYouTubeIframeAPIReady=function(){ready=true};

function parseT(v){v=(v||"").trim();var p=v.split(":");if(!v||p.length>3)return NaN;var t=0;for(var i=0;i<p.length;i++){if(!/^\d+$/.test(p[i]))return NaN;t=t*60+parseInt(p[i],10)}return t}
function fmt(s){s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+(m<10?"0":""):"")+m+":"+(x<10?"0":"")+x}
function vid(u){var m=(u||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test((u||"").trim())?u.trim():null)}
function say(k){$("err").textContent=k?TX[lang][k]:""}

function setLang(l){
 lang=l;var s=TX[l];document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=s[e.dataset.t]});
 document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=s[e.dataset.p]});
 document.querySelectorAll(".pills button").forEach(function(b){b.classList.toggle("on",b.dataset.l===l)});
 document.querySelectorAll(".row").forEach(function(r){var i=r.querySelectorAll("input");i[0].placeholder=s.from;i[1].placeholder=s.to});
 $("cp").textContent=s.copy;document.title="Skip Player";updMark();say("");drawLib();
}
function updMark(){$("mark").textContent=pend===null?TX[lang].skip:TX[lang].end;$("mark").classList.toggle("on",pend!==null)}
function setMode(m){mode=m;$("mYt").classList.toggle("on",m==="yt");$("mLoc").classList.toggle("on",m==="loc");$("ytIn").hidden=m!=="yt";$("locIn").hidden=m!=="loc";say("")}

function addRow(a,b){
 var r=document.createElement("div");r.className="row";
 r.innerHTML='<input type="text" dir="ltr"><span>–</span><input type="text" dir="ltr"><button type="button" class="x" aria-label="×">×</button>';
 var i=r.querySelectorAll("input");i[0].value=a||"";i[1].value=b||"";i[0].placeholder=TX[lang].from;i[1].placeholder=TX[lang].to;
 i[0].onchange=i[1].onchange=function(){onRanges()};
 r.querySelector("button").onclick=function(){r.remove();onRanges()};
 $("rows").appendChild(r);
}
function readRanges(){
 var out=[],bad=false,rows=document.querySelectorAll("#rows .row");
 rows.forEach(function(r){
  var i=r.querySelectorAll("input");if(!i[0].value.trim()&&!i[1].value.trim()){r.classList.remove("bad");return}
  var a=parseT(i[0].value),b=parseT(i[1].value);
  if(isNaN(a)||isNaN(b)||a>=b){bad=true;r.classList.add("bad");return}
  r.classList.remove("bad");out.push([a,b]);
 });
 out.sort(function(x,y){return x[0]-y[0]});skips=out;
 $("rerr").hidden=!bad;$("rEmpty").hidden=rows.length>0;
}
function getT(){try{return mode==="yt"?player.getCurrentTime():lv.currentTime}catch(e){return NaN}}
function getDur(){try{return mode==="yt"?player.getDuration():lv.duration}catch(e){return 0}}
function seek(t){
 lastSeek=Date.now();
 try{
  if(mode==="yt")player.seekTo(t,true);
  else{
   if(recOn&&rec&&rec.state==="recording"){rec.pause();lv.addEventListener("seeked",function f(){lv.removeEventListener("seeked",f);if(recOn&&rec.state==="paused")rec.resume()})}
   lv.currentTime=t;
  }
 }catch(e){}
}
function drawTl(){
 var d=getDur(),h="";
 if(d>0){skips.forEach(function(r){h+='<i class="cut" style="left:'+r[0]/d*100+'%;width:'+(Math.min(r[1],d)-r[0])/d*100+'%"></i>'});if(pend!==null)h+='<i class="pend" style="left:'+pend/d*100+'%"></i>'}
 $("cuts").innerHTML=h;
}
function key(){return"skip_"+curId}
function save(){
 if(!curId)return;
 try{var a=[];document.querySelectorAll("#rows .row").forEach(function(r){var i=r.querySelectorAll("input");if(i[0].value.trim()||i[1].value.trim())a.push([i[0].value,i[1].value])});localStorage.setItem(key(),JSON.stringify(a));touchLib(a.length)}catch(e){}
}
function cmd(){
 if(mode!=="loc"||!lf||!skips.length){$("ffbox").hidden=true;return}
 var c=skips.map(function(r){return"between(t,"+r[0]+","+r[1]+")"}).join("+");
 $("cmd").value='ffmpeg -i "'+lf.name+'" -vf "select=\'not('+c+')\',setpts=N/FRAME_RATE/TB" -af "aselect=\'not('+c+')\',asetpts=N/SR/TB" "cut_'+lf.name+'"';
 $("ffbox").hidden=false;
}
function onRanges(skipSave){readRanges();drawTl();if(!skipSave)save();cmd()}
function begin(){
 $("hero").hidden=true;$("stage").hidden=false;active=true;lastDur=0;pend=null;updMark();
 $("rows").innerHTML="";var a=[];try{a=JSON.parse(localStorage.getItem(key())||"[]")}catch(e){}
 a.forEach(function(r){addRow(r[0],r[1])});onRanges(true);if(mode==="yt"&&a.length)touchLib(a.length);
}
function loadYt(){
 var id=vid($("url").value);if(!id){say("bad");return}
 if(!ready&&!(window.YT&&YT.Player)){say("api");return}
 say("");try{lv.pause()}catch(e){}
 mode="yt";curId=id;titled=false;lv.hidden=true;begin();
 var pl=$("pl");pl.hidden=false;
 if(player&&player.loadVideoById)player.loadVideoById(id);
 else player=new YT.Player("pl",{videoId:id,playerVars:{autoplay:1,rel:0,playsinline:1},events:{onReady:function(e){e.target.playVideo()}}});
}
function loadLoc(f){
 if(!f)return;lf=f;say("");$("fname").textContent=f.name;
 try{if(player&&player.pauseVideo)player.pauseVideo()}catch(e){}
 mode="loc";curId="f:"+f.name+f.size;begin();$("pl").hidden=true;lv.hidden=false;
 if(lv.dataset.u)URL.revokeObjectURL(lv.dataset.u);
 var u=URL.createObjectURL(f);lv.dataset.u=u;lv.src=u;lv.play().catch(function(){});
}
var titled=false;
function lib(){try{return JSON.parse(localStorage.getItem("skip_lib")||"[]")}catch(e){return[]}}
function setLib(a){try{localStorage.setItem("skip_lib",JSON.stringify(a))}catch(e){}}
function rangesOf(id){try{return JSON.parse(localStorage.getItem("skip_"+id)||"[]").length}catch(e){return 0}}
function ytTitle(){try{return player.getVideoData().title||""}catch(e){return""}}
function backfill(){
 try{
  var l=lib(),ch=false;
  for(var i=0;i<localStorage.length;i++){
   var k=localStorage.key(i);if(k.indexOf("skip_")!==0)continue;
   var id=k.slice(5);
   if(/^[A-Za-z0-9_-]{11}$/.test(id)&&rangesOf(id)&&!l.some(function(x){return x.id===id})){l.push({id:id,title:""});ch=true}
  }
  if(ch)setLib(l);
 }catch(e){}
}
function touchLib(n){
 if(mode!=="yt"||!curId)return;
 var l=lib(),i=l.findIndex(function(x){return x.id===curId});
 if(!n){if(i>=0){l.splice(i,1);setLib(l)}}
 else{var t=ytTitle()||(i>=0?l[i].title:"");if(i>=0)l[i].title=t;else l.unshift({id:curId,title:t});setLib(l)}
 drawLib();
}
function drawLib(){
 var l=lib(),box=$("libList"),s=TX[lang];$("lib").hidden=!l.length;box.innerHTML="";
 l.forEach(function(x){
  var d=document.createElement("div");d.className="li";
  d.innerHTML='<div><strong></strong><span class="muted"></span></div><button class="btn" type="button"></button><button class="x" type="button" aria-label="×">×</button>';
  d.querySelector("strong").textContent=x.title||("youtube.com/watch?v="+x.id);
  d.querySelector("span").textContent=s.cnt.replace("{n}",rangesOf(x.id));
  var b=d.querySelectorAll("button");b[0].textContent=s.play;
  b[0].onclick=function(){setMode("yt");$("url").value="https://www.youtube.com/watch?v="+x.id;loadYt();window.scrollTo({top:0,behavior:"smooth"})};
  b[1].onclick=function(){
   if(!confirm(s.del))return;
   try{localStorage.removeItem("skip_"+x.id)}catch(e){}
   setLib(lib().filter(function(y){return y.id!==x.id}));
   if(mode==="yt"&&curId===x.id){$("rows").innerHTML="";onRanges(true)}
   drawLib();
  };
  box.appendChild(d);
 });
}
var rec=null,chunks=[],recOn=false,recMime="";
function resetRec(){$("rec").hidden=false;$("cancel").hidden=true;$("prog").hidden=true;$("pbar").style.width="0"}
function startRec(){
 if(mode!=="loc"||!lf)return;
 var st=null;try{st=lv.captureStream?lv.captureStream():lv.mozCaptureStream()}catch(e){}
 if(!st||!window.MediaRecorder){$("rst").textContent=TX[lang].noRec;return}
 var mt=["video/webm;codecs=vp9,opus","video/webm","video/mp4"].filter(function(m){return MediaRecorder.isTypeSupported(m)})[0]||"";
 chunks=[];
 try{rec=new MediaRecorder(st,mt?{mimeType:mt}:{})}catch(e){$("rst").textContent=TX[lang].noRec;return}
 recMime=rec.mimeType||mt;
 rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=finishRec;
 var first=0;skips.forEach(function(r){if(first>=r[0]&&first<r[1])first=r[1]});
 recOn=true;$("rec").hidden=true;$("cancel").hidden=false;$("prog").hidden=false;$("dl").hidden=true;$("rst").textContent=TX[lang].recing;
 lv.muted=false;lv.currentTime=first;rec.start(1000);lv.play().catch(function(){});
}
function finishRec(){
 recOn=false;
 var type=(recMime||"video/webm").split(";")[0],ext=type.indexOf("mp4")>=0?"mp4":"webm";
 var a=$("dl");if(a.dataset.u)URL.revokeObjectURL(a.dataset.u);
 a.dataset.u=a.href=URL.createObjectURL(new Blob(chunks,{type:type}));
 a.download="cut_"+lf.name.replace(/\.[^.]+$/,"")+"."+ext;a.textContent=TX[lang].dl;a.hidden=false;
 resetRec();$("rst").textContent=TX[lang].done;
}
lv.onended=function(){if(recOn&&rec&&rec.state!=="inactive")rec.stop()};

 var t=getT();if(isNaN(t))return;
 if(pend===null)pend=t;else{var a=pend;pend=null;if(t-a>=.5)addRow(fmt(a),fmt(Math.ceil(t)))}
 updMark();onRanges();

 var t=$("cmd");t.select();
 try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand("copy")}catch(e2){}}
 $("cp").textContent=TX[lang].copied;setTimeout(function(){$("cp").textContent=TX[lang].copy},1500);
};

 if(mode==="yt"&&!titled){var tt0=ytTitle();if(tt0){titled=true;var l0=lib(),i0=l0.findIndex(function(x){return x.id===curId});if(i0>=0&&l0[i0].title!==tt0){l0[i0].title=tt0;setLib(l0);drawLib()}}}
 if(Date.now()-lastSeek>600)for(var i=0;i<skips.length;i++){if(t>=skips[i][0]&&t<skips[i][1]){seek(skips[i][1]);return}}
 if(d>0){$("ph").style.left=Math.min(t/d*100,99.5)+"%";$("tt").textContent=fmt(t)+" / "+fmt(d);if(recOn)$("pbar").style.width=(t/d*100)+"%";if(d!==lastDur){lastDur=d;drawTl()}}
},120);
